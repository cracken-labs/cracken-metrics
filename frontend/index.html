<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cracken-Metrics // Конструктор Стратегий</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0c0e;
            color: #d8d9da;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        .container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            flex-grow: 1;
        }
        .header h1 {
            color: #fff;
            margin: 0 0 5px 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header p {
            color: #7b7c7e;
            margin: 0;
            font-size: 14px;
        }
        .form-panel {
            background-color: #181b1f;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #2c323a;
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        .input-group.short {
            flex-grow: 0;
            width: 280px;
        }
        label {
            font-size: 11px;
            color: #a2a3a5;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        input {
            background-color: #0b0c0e;
            border: 1px solid #2c323a;
            color: #fff;
            padding: 12px;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #3274d9;
        }
        button {
            background-color: #3274d9;
            color: #fff;
            border: none;
            padding: 13px 24px;
            border-radius: 4px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #2458a6;
        }
        .preview-panel {
            flex-grow: 1;
            background-color: #181b1f;
            border-radius: 6px;
            border: 1px solid #2c323a;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 400px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none;
        }
        .placeholder-text {
            color: #4e5156;
            font-size: 15px;
            text-align: center;
            line-height: 1.5;
        }
        .error-message {
            color: #f25c54;
            font-size: 13px;
            margin-top: 5px;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Cracken-Metrics 🐙</h1>
        <p>Свободный конструктор формул для онлайн-мониторинга Мосбиржи</p>
    </div>

    <div class="form-panel">
        <div class="input-group short">
            <label for="metricName">Название виджета (ENG)</label>
            <input type="text" id="metricName" placeholder="Например: sber_ratio" value="sber_ratio">
        </div>
        <div class="input-group">
            <label for="formulaInput">Математическая формула стратегии</label>
            <input type="text" id="formulaInput" placeholder="Например: (SBER * 2) / GAZP" value="SBER / GAZP">
            <div id="errorBox" class="error-message"></div>
        </div>
        <button id="saveBtn">Построить график</button>
    </div>

    <div class="preview-panel" id="previewPanel">
        <div class="placeholder-text" id="placeholderText">
            Введите название, формулу стратегии и нажмите кнопку.<br>
            <span style="font-size: 12px; color: #3a3d42;">Доступные тикеры в базе: SBER, GAZP, LKOH, YNDX, ROSN, NVTK, VTBR, T</span>
        </div>
        <iframe id="chartIframe" src=""></iframe>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
